name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Verify
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee build.log
      - name: Summarize failure
        if: failure()
        run: |
          {
            echo '```'
            grep -E '\[ERROR\]|Tests run:|BUILD|Caused by' build.log | tail -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p ci-logs
          tail -c 60000 build.log > ci-logs/last-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-log
          git add -f ci-logs/last-failure.log
          git commit -m "ci: capture failure log [skip ci]"
          git push -f origin ci-log
