name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Verify
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee build.log
      - name: Summarize failure
        if: failure()
        run: |
          {
            echo '```'
            grep -E '\[ERROR\]|Tests run:|BUILD|Caused by' build.log | tail -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
