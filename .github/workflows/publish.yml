name: Publish to GitHub Packages

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Deploy
        run: |
          set -o pipefail
          mvn -B -ntp deploy 2>&1 | tee build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Capture failure
        if: failure()
        run: |
          mkdir -p ci-logs
          tail -c 60000 build.log > ci-logs/publish-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-log
          git add -f ci-logs/publish-failure.log
          git commit -m "ci: capture publish failure log [skip ci]"
          git push -f origin ci-log
